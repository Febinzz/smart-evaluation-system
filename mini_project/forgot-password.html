<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Evaluation AI - Forgot Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="frontpage.css">
<link rel="stylesheet" href="front.css">
<style>
  .recovery-note {
    margin-top: 10px;
    color: #555;
    line-height: 1.6;
    font-size: 0.98rem;
  }

  .recovery-form {
    text-align: left;
  }

  .recovery-form label {
    display: block;
    margin: 16px 0 8px;
    color: #5a0f1b;
    font-size: 0.95rem;
    font-weight: 700;
  }

  .recovery-form .msg {
    margin-top: 14px;
    min-height: 22px;
    font-size: 0.95rem;
    color: #6a5b58;
    text-align: center;
  }

  .recovery-links {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 0.9rem;
  }

  .recovery-links a {
    color: #5a0f1b;
    text-decoration: none;
    font-weight: 700;
  }

  .recovery-links a:hover {
    text-decoration: underline;
  }

</style>
</head>

<body>

<div class="left">
  <i class="fas fa-shield-halved edu-left l1"></i>
  <i class="fas fa-book-reader edu-left l2"></i>
  <i class="fas fa-key edu-left l3"></i>

  <img src="frontpage.png" class="logo">

  <h1 class="title">PASSWORD HELP</h1>
  <p class="subtitle">
    Recover your account in a clean, secure, and simple way.
  </p>
  <p class="recovery-note">
    Request an OTP to reset your password if you already know the registered email.
  </p>
</div>

<div class="right">
  <i class="fas fa-graduation-cap edu-right r1"></i>
  <i class="fas fa-book edu-right r2"></i>
  <i class="fas fa-pen edu-right r3"></i>

  <div class="login-box">
    <div style="text-align:center; margin-bottom:20px;">
      <i class="fas fa-lock" style="font-size:3rem; color:#5a0f1b;"></i>
    </div>
    <div class="login-title">Forgot Password?</div>

    <form class="recovery-form" onsubmit="event.preventDefault(); sendOtp();">
      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="user@gmail.com" autocomplete="email" required>

      <button id="sendBtn" type="submit">
        <i class="fas fa-paper-plane"></i> Send OTP
      </button>

      <div id="msg" class="msg"></div>

      <div class="recovery-links">
            <a id="link-reset" href="reset-password.html">Already have OTP?</a>
            <a id="link-username" href="forgot-username.html">Forgot Username?</a>
      </div>
    </form>
  </div>
</div>

<script>
async function sendOtp() {
  const email = document.getElementById('email').value.trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('sendBtn');
  msg.textContent = '';
  btn.disabled = true;

  try {
    const res = await fetch('/api/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    msg.textContent = data.message || 'Request completed';
  } catch (err) {
    msg.textContent = 'Something went wrong. Please try again.';
  } finally {
    btn.disabled = false;
  }
}
</script>

<script>
// Propagate ?role=student|teacher between recovery pages so back-to-login works
function propagateRoleToRecoveryLinks(){
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role');
  if(!role) return;
  ['link-reset','link-username'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const url = new URL(el.getAttribute('href'), window.location.origin);
    url.searchParams.set('role', role);
    el.href = url.pathname + url.search;
  });
}
document.addEventListener('DOMContentLoaded', propagateRoleToRecoveryLinks);
</script>

</body>
</html>
