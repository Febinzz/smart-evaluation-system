<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Evaluation AI - Reset Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="frontpage.css">
<link rel="stylesheet" href="front.css">
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    overflow: auto;
  }

  .left, .right {
    padding-top: 28px;
    padding-bottom: 28px;
  }

  .left {
    justify-content: center;
  }

  .logo {
    width: 210px;
    margin-bottom: 16px;
  }

  .title {
    font-size: 2.1rem;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 1rem;
    line-height: 1.45;
  }

  .recovery-note {
    margin-top: 8px;
    color: #555;
    line-height: 1.45;
    font-size: 0.92rem;
  }

  .recovery-form {
    text-align: left;
  }

  .recovery-form label {
    display: block;
    margin: 10px 0 6px;
    color: #5a0f1b;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .login-box {
    max-width: 360px;
    padding: 26px 24px;
  }

  .login-title {
    font-size: 1.45rem;
    margin-bottom: 16px;
  }

  .login-box input {
    padding: 10px 12px;
    margin: 8px 0;
    font-size: 0.95rem;
  }

  .login-box button {
    margin-top: 14px;
    padding: 11px 14px;
    font-size: 0.95rem;
  }

  .recovery-form .msg {
    margin-top: 10px;
    min-height: 18px;
    font-size: 0.9rem;
    color: #6a5b58;
    text-align: center;
  }

  .recovery-links {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }

  .recovery-links a {
    color: #5a0f1b;
    text-decoration: none;
    font-weight: 700;
  }

  .recovery-links a:hover {
    text-decoration: underline;
  }

  @media (max-height: 820px) {
    .left, .right {
      padding-top: 18px;
      padding-bottom: 18px;
    }

    .logo {
      width: 170px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 1.8rem;
    }

    .login-box {
      padding: 22px 20px;
    }

    .login-box input {
      padding: 9px 11px;
      margin: 6px 0;
    }

    .recovery-form label {
      margin: 8px 0 5px;
    }

    .recovery-links {
      margin-top: 10px;
    }
  }

  /* Responsive layout: two-column on wide screens, stacked on mobile */
  @media (min-width: 900px) {
    body { display: flex; align-items: stretch; }
    .left { width: 46%; padding: 48px 36px; display:flex; flex-direction:column; justify-content:center; }
    .right { width: 54%; display:flex; align-items:center; justify-content:center; padding:48px; }
    .login-box { max-width:420px; margin:0; }
  }

  @media (max-width: 899px) {
    .left, .right { width:100% !important; padding:18px !important; display:block !important; min-height: auto !important; overflow: visible !important; }
    body { flex-direction: column !important; }
    .login-box { max-width: 100%; margin:12px auto; text-align: left; }
    .edu-left, .edu-right { display: none !important; }
    .left, .right { position: relative !important; }
    .title { text-align: left; }
    .left { align-items: flex-start !important; text-align: left !important; }
    .left .logo { margin-left: 0 !important; margin-right: 0 !important; }
    .subtitle, .recovery-note { text-align: left !important; }
  }
  /* Center logo on mobile while keeping text left-aligned */
  @media (max-width:899px) {
    .left .logo { display:block !important; margin: 0 auto 12px auto !important; }
  }
  /* small phones: tighten spacing */
  @media (max-width:420px) {
    .left, .right { padding:14px !important; }
    .logo { width: 160px !important; }
    .title { font-size:1.6rem !important; }
    .login-box { padding:18px !important; }
    .login-box input { padding:10px !important; }
    .login-box button { width:100%; }
  }
</style>
</head>

<body>

<div class="left">
  <i class="fas fa-lock edu-left l1"></i>
  <i class="fas fa-book-reader edu-left l2"></i>
  <i class="fas fa-key edu-left l3"></i>

  <img src="frontpage.png" class="logo">

  <h1 class="title">RESET PASSWORD</h1>
  <p class="subtitle">
    Set a new password using the OTP sent to your registered email.
  </p>
  <p class="recovery-note">
    Keep your OTP handy and choose a strong password you can remember.
  </p>
</div>

<div class="right">
  <i class="fas fa-graduation-cap edu-right r1"></i>
  <i class="fas fa-book edu-right r2"></i>
  <i class="fas fa-pen edu-right r3"></i>

  <div class="login-box">
    <div style="text-align:center; margin-bottom:14px;">
      <i class="fas fa-unlock-keyhole" style="font-size:2.5rem; color:#5a0f1b;"></i>
    </div>
    <div class="login-title">Reset Password</div>

    <form class="recovery-form" onsubmit="event.preventDefault(); resetPassword();">
      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="user@gmail.com" autocomplete="email" required>

      <label for="otp">OTP</label>
      <input id="otp" type="text" placeholder="6-digit code" inputmode="numeric" maxlength="6" required>

      <label for="password">New Password</label>
      <input id="password" type="password" placeholder="New password" minlength="6" required>

      <label for="confirm">Confirm Password</label>
      <input id="confirm" type="password" placeholder="Confirm new password" minlength="6" required>

      <button id="resetBtn" type="submit">
        <i class="fas fa-shield-halved"></i> Reset Password
      </button>

      <div id="msg" class="msg"></div>

      <div class="recovery-links">
        <a href="forgot-password.html">Request OTP Again</a>
        <a href="forgot-username.html">Forgot Username?</a>
        <a id="back-to-login" href="#">Login</a>
      </div>
    </form>
  </div>
</div>

<script>
async function resetPassword() {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('resetBtn');
  msg.textContent = '';

  if (password !== confirm) {
    msg.textContent = 'Passwords do not match.';
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch('/api/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, otp, password })
    });
    const data = await res.json();
    msg.textContent = data.message || 'Done';
  } catch (err) {
    msg.textContent = 'Something went wrong. Please try again.';
  } finally {
    btn.disabled = false;
  }
}
</script>

<script>
// Navigate back to the appropriate login page based on optional role param
function initBackToLogin(){
  const params = new URLSearchParams(window.location.search);
  const role = (params.get('role') || '').toLowerCase();
  const target = role === 'teacher' ? 'admin portal.html' : 'student portal.html';
  const el = document.getElementById('back-to-login');
  if(el) el.href = target;
}

// Propagate role param between recovery pages
function propagateRoleToRecoveryLinks(){
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role');
  if(!role) return;
  const links = document.querySelectorAll('.recovery-links a');
  links.forEach(a=>{
    if(a.id === 'back-to-login') return;
    const url = new URL(a.getAttribute('href'), window.location.origin);
    url.searchParams.set('role', role);
    a.href = url.pathname + url.search;
  });
}

document.addEventListener('DOMContentLoaded', ()=>{ initBackToLogin(); propagateRoleToRecoveryLinks(); });
</script>
 

</body>
</html>
